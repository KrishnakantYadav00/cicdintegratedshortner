name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify environment
        run: python check_deps.py

      - name: Lint
        run: flake8 app.py tests/ --max-line-length=100

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t url-shortener:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d -p 5000:5000 --name smoke url-shortener:${{ github.sha }}
          sleep 3
          curl -f http://localhost:5000/health
          docker stop smoke
