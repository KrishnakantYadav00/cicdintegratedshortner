<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    input, button { font-size: 16px; padding: 8px; }
    input[type=text] { width: 70%; }
    #result { margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <input id="url" type="text" placeholder="https://example.com/very/long/link">
  <button onclick="shorten()">Shorten</button>
  <div id="result"></div>

  <script>
    async function shorten() {
      const url = document.getElementById('url').value;
      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      const el = document.getElementById('result');
      el.textContent = res.ok ? data.short_url : ('Error: ' + data.error);
    }
  </script>
</body>
</html>
