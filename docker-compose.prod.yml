services:
  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-krishnakantyadav00/cicdintegratedshortner}:${IMAGE_TAG:-latest}
    container_name: url-shortener-prod
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD:-secret123}@db:5432/${POSTGRES_DB:-shortener_db}
      - WEB_CONCURRENCY=4
      - GUNICORN_THREADS=4
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: url-shortener-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret123}
      POSTGRES_DB: ${POSTGRES_DB:-shortener_db}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shortener} -d ${POSTGRES_DB:-shortener_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
